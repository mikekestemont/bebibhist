[project]
name = "bhb"
version = "0.1.0"
description = "Pipeline for the Bibliography of Belgian History (BGB-BHB): ingest, normalise, export"
requires-python = ">=3.10"
dependencies = [
    "lxml>=4.9",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bhb = "bhb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bhb*"]
