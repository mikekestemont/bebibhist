[project]
name = "bhb"
version = "0.1.0"
description = "Pipeline for the Bibliography of Belgian History (BGB-BHB): ingest, normalise, export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=4.9",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "numpy>=1.26"]
classify = ["scikit-learn>=1.4"]
language = ["lingua-language-detector>=2.1"]
embed = ["sentence-transformers>=3.0", "torch>=2.4", "numpy>=1.26", "scikit-learn>=1.4"]
lock = ["pip-tools>=7.4"]
# The map of subjects (bhb topicmap): UMAP, and the local model that names its regions (Apple silicon only, so
# outside requirements.lock).
topicmap = ["umap-learn==0.5.9.post2", "mlx-lm==0.32.2", "scikit-learn>=1.4"]

[project.scripts]
bhb = "bhb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bhb*"]
