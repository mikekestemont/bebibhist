<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BHB search benchmark</title>
  <style>
    body { font: 16px/1.45 Georgia, serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #1c1c1c; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.3rem 0.6rem; border-bottom: 1px solid #ccc; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Search benchmark</h1>
  <p>Synthetic bibliography, queried in this browser through <code>sql.js-httpvfs</code> over HTTP range requests.</p>
  <p id="status">Loading the database…</p>
  <table id="results" hidden>
    <thead>
      <tr><th>Query</th><th>Cold</th><th>Warm</th><th>Cold bytes</th><th>Rows</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <pre id="out"></pre>
  <script src="/bench/vendor/sql.js-httpvfs/index.js"></script>
  <script>
    const QUERIES = {
      a: "SELECT rowid FROM fts WHERE fts MATCH 'zzqxrareterm'",
      b: "SELECT count(*) AS n FROM fts WHERE fts MATCH 'histoire'",
      c: "WITH hits AS (SELECT rowid FROM fts WHERE fts MATCH 'histoire' LIMIT 5000) SELECT 'type' AS facet, type AS value, count(*) AS n FROM hits JOIN facets USING (rowid) GROUP BY type UNION ALL SELECT 'lang', lang, count(*) FROM hits JOIN facets USING (rowid) GROUP BY lang UNION ALL SELECT 'period', facet_multi.value, count(*) FROM hits JOIN facet_multi ON facet_multi.rowid = hits.rowid AND facet_multi.facet = 'period' GROUP BY facet_multi.value",
      d: "SELECT count(*) AS n FROM facets WHERE year BETWEEN 1980 AND 1989",
      e: "SELECT r.id, r.display FROM fts JOIN records r ON r.rowid = fts.rowid WHERE fts MATCH 'histoire' LIMIT 20",
      f: "SELECT r.id, r.printed FROM fts JOIN records r ON r.rowid = fts.rowid WHERE fts MATCH 'histoire' LIMIT 2000"
    };

    function cell(text, numeric) {
      const item = document.createElement("td");
      item.textContent = text;
      if (numeric) item.className = "num";
      return item;
    }

    async function measure(db, worker, sql) {
      const before = await worker.getStats();
      const started = performance.now();
      const rows = await db.query(sql);
      const ms = performance.now() - started;
      const after = await worker.getStats();
      return {
        ms: Math.round(ms),
        rows: rows.length,
        bytes: after.totalFetchedBytes - before.totalFetchedBytes,
        requests: after.totalRequests - before.totalRequests
      };
    }

    async function main() {
      const status = document.getElementById("status");
      const started = performance.now();
      const ready = await createDbWorker(
        [{ from: "jsonconfig", configUrl: "/build/bench/config.json" }],
        "/bench/vendor/sql.js-httpvfs/sqlite.worker.js",
        "/bench/vendor/sql.js-httpvfs/sql-wasm.wasm"
      );
      const startup = await measure(ready.db, ready.worker, "SELECT count(*) AS n FROM records");
      startup.ms = Math.round(performance.now() - started);
      const cold = {};
      const warm = {};
      for (const [name, sql] of Object.entries(QUERIES)) {
        cold[name] = await measure(ready.db, ready.worker, sql);
        warm[name] = await measure(ready.db, ready.worker, sql);
      }
      const report = { startup, cold, warm };
      const body = document.querySelector("#results tbody");
      for (const name of Object.keys(QUERIES)) {
        const row = document.createElement("tr");
        row.append(
          cell(name),
          cell(cold[name].ms + " ms", true),
          cell(warm[name].ms + " ms", true),
          cell(cold[name].bytes.toLocaleString() + " B", true),
          cell(String(cold[name].rows), true)
        );
        body.append(row);
      }
      document.getElementById("results").hidden = false;
      document.getElementById("out").textContent = JSON.stringify(report);
      status.textContent = "Done.";
      document.body.dataset.ready = "1";
    }

    main().catch((error) => {
      document.getElementById("status").textContent = String(error && error.stack || error);
      document.body.dataset.ready = "error";
    });
  </script>
</body>
</html>
