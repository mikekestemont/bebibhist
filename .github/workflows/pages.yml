name: pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  # The site is built and checked in one job and deployed in another, so a deployment that stalls is tried again on
  # its own in a few minutes (pages-retry.yml does so once; by hand, "Re-run failed jobs" or gh run rerun <id>
  # --failed), instead of a new run that builds for 20 to 30 minutes first.
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'data-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No data- release to build from"
            exit 1
          fi
          mkdir -p build
          gh release download "$tag" --pattern records.jsonl.gz --dir build
          gzip -dc build/records.jsonl.gz > build/records.jsonl
          echo "records from $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          start=$(date +%s)
          npm ci
          npm run index
          npm run build
          echo "site index and build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

      # GitHub Pages copies every file of a deployment. With about 200,000 files (one Pagefind fragment per record)
      # and 560 MB, that copy stalled past its 10 minutes on three of eight deployments of 10 Nov 2026; the records
      # now come in 4,096 files (scripts/build-index.mjs, ``writeRecordFiles``). A build that grows back towards
      # that fails here, before it is deployed.
      - name: Check the artifact size and file count
        run: |
          size=$(du -sm --apparent-size site/dist | cut -f1)
          files=$(find site/dist -type f | wc -l)
          echo "site/dist: ${size} MB in ${files} files" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 600 ]; then
            echo "site/dist is ${size} MB, above the 600 MB limit"
            exit 1
          fi
          if [ "$files" -gt 40000 ]; then
            echo "site/dist has ${files} files, above the 40,000 limit"
            exit 1
          fi

      - name: Check search before deploying
        working-directory: site
        # "shell: bash" runs with pipefail, so a failing check is not hidden by tee.
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          # Served under /bebibhist/, as on GitHub Pages, so that a file looked for at the root fails here too.
          npx vite preview --port 4173 --strictPort --base /bebibhist/ > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4173/bebibhist/ > /dev/null && break; sleep 1; done
          npm run check -- http://localhost:4173/bebibhist/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages takes an artifact once: a second deployment of the same artifact never got a status and timed out (10
      # Nov 2026), while a new artifact of the same commit was taken. So a re-run of this job deploys a copy of the
      # build's artifact under a name of its own.
      - name: Download the build's artifact again
        if: github.run_attempt != '1'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Upload it as a new artifact
        if: github.run_attempt != '1'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          artifact_name: ${{ github.run_attempt == '1' && 'github-pages' || format('github-pages-attempt-{0}', github.run_attempt) }}
