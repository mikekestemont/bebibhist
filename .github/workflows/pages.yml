name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "data/curated/**"
      - "2023-12-29/**"
      - "exports Rijksarchief/**"
      - "data/interim/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install the pipeline
        run: |
          start=$(date +%s)
          pip install -e "pipeline[classify]"
          echo "install python: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build records
        run: |
          start=$(date +%s)
          bhb build
          echo "bhb build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          start=$(date +%s)
          npm ci
          npm run index
          npm run build
          echo "site index and build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the artifact size
        run: |
          start=$(date +%s)
          size=$(du -sm site/dist | cut -f1)
          echo "site/dist: ${size} MB" >> "$GITHUB_STEP_SUMMARY"
          echo "size check: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 900 ]; then
            echo "site/dist is ${size} MB, above the 900 MB limit"
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
