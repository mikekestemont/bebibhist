name: pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'data-')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No data- release to build from"
            exit 1
          fi
          mkdir -p build
          gh release download "$tag" --pattern records.jsonl.gz --dir build
          gzip -dc build/records.jsonl.gz > build/records.jsonl
          echo "records from $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          start=$(date +%s)
          npm ci
          npm run index
          npm run build
          echo "site index and build: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the artifact size
        run: |
          size=$(du -sm site/dist | cut -f1)
          echo "site/dist: ${size} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 900 ]; then
            echo "site/dist is ${size} MB, above the 900 MB limit"
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
